[workspace]
resolver = "2"
exclude = [
  # Standalone SDK and example crates with their own lockfiles; not part of the server.
  "packages/rust-server",
  "examples/rust-server",
]
members = [
  "crates/flags-core",
  "crates/flags-mcp",
  "crates/flags-api",
  "crates/flags-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.88"

[workspace.dependencies]
flags-core = { path = "crates/flags-core" }
flags-mcp = { path = "crates/flags-mcp" }
flags-api = { path = "crates/flags-api" }

# otto-flags is a resource server of the otto platform: identity, auth, orgs,
# teams, plans, and billing live there. This workspace links only the
# tenant-isolation substrate (`otto-tenant`: pinned transactions, RLS proof, the
# audit-trail pattern) and the resource-server client (`otto-resource`:
# introspection, usage shipping, member lookups, webhook verification). One rev
# for both, bumped deliberately rather than tracking a branch.
otto-tenant = { git = "https://github.com/savvagent/otto-platform", rev = "a5d169f058ff086590832a183c7d10f50ad27545" }
otto-resource = { git = "https://github.com/savvagent/otto-platform", rev = "a5d169f058ff086590832a183c7d10f50ad27545" }

sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "macros", "migrate", "json",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
http = "1"
rmcp = { version = "=2.0.0", features = ["server", "macros", "transport-streamable-http-server", "schemars"] }
schemars = { version = "1.1", features = ["chrono04", "uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
futures = "0.3"
url = "2"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
# Loads .env for local runs. Never overrides a variable already set, so a
# deployment's real environment always wins over a file that got shipped.
dotenvy = "0.15"

[profile.release]
lto = "thin"
strip = true
