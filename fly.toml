# otto-flags on Fly.io, org "savvagent". See docs/deploy/fly.md.
#
# Savvagent Flags, served at https://flags.savvagent.com. A resource server of
# the Savvagent platform (https://savvagent.com): identity, OAuth, orgs, and
# billing live there; this app holds only flags. The Fly app keeps its
# otto-flags name, and the FLAGS_* variables keep theirs.
#
# Database: `otto_flags` on `otto-db`, the unmanaged Fly Postgres shared with
# otto-platform and otto-factory (shared for cost; split before real
# customers, since each app's attach role is a superuser on the whole
# instance). Isolation rests on `savvagent_tenant::Db::begin` issuing
# `SET LOCAL ROLE otto_app`; flags-server proves that at boot.
#
# Secrets (`fly secrets set`, never here):
#   DATABASE_URL                    from `fly postgres attach`
#   FLAGS_INTROSPECTION_SECRET      sav_rs_... (or otto_rs_...)       from `resource rotate-secret`
#   FLAGS_PLATFORM_WEBHOOK_SECRET   sav_whsec_... (or otto_whsec_...) from `resource set-webhook`

app = "otto-flags"
primary_region = "iad"
# Time between SIGTERM and SIGKILL. On SIGTERM the server stops its usage
# tasks at once: the usage shipper's final pass and the evaluation meter's
# final flush (bounded at 5 s) run while HTTP drains. An open SDK flag stream
# keeps the drain going until this kill, so it is also how long a stop takes.
kill_timeout = "15s"

[build]
  dockerfile = "Dockerfile"

[env]
  FLAGS_BIND = "0.0.0.0:8080"
  FLAGS_PUBLIC_URL = "https://flags.savvagent.com"
  # The token audience: exactly the resource_uri registered at the platform.
  FLAGS_RESOURCE_URI = "https://flags.savvagent.com/mcp"
  FLAGS_PLATFORM_URL = "https://savvagent.com"
  # Extra Host headers /mcp accepts besides the public host. The fly.dev name
  # still answers (health checks, debugging). The legacy otto-flags.savvagent.com
  # is no longer listed: it is a redirect host (below).
  FLAGS_ALLOWED_HOSTS = "otto-flags.fly.dev"
  # Hosts that only redirect (savvagent/otto-platform#135): every path but /api/
  # answers 308 to FLAGS_PUBLIC_URL with the path and query kept. /api/ (the
  # SDKs) is served as usual, because SDK builds made before the rebrand default
  # to this host and do not follow redirects. Must not overlap
  # FLAGS_ALLOWED_HOSTS or the public host: the server refuses to start.
  FLAGS_REDIRECT_HOSTS = "otto-flags.savvagent.com"
  # Small: otto-db is a shared 512 MB instance.
  FLAGS_DB_MAX_CONNECTIONS = "5"
  FLAGS_LOG_FORMAT = "json"
  # Most evaluations answered to public client keys that are billed per app
  # per hour; more are served and not billed (#143). Default 500000.
  FLAGS_CLIENT_EVAL_CEILING_PER_HOUR = "500000"
  RUST_LOG = "info,flags_server=info,flags_mcp=info,flags_api=info"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  # One machine always runs: resuming a suspended one took 2.2s, longer than a
  # 2s SDK timeout, so the first evaluation after idle fell back to defaults
  # (#191). Machines above the minimum still suspend when idle.
  auto_stop_machines = "suspend"
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    # SDK streams are long-lived connections; leave headroom for them.
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    # Readiness, not liveness: whether to route traffic here.
    path = "/readyz"
    method = "GET"
    interval = "15s"
    timeout = "5s"
    # Migrations run at startup under an advisory lock.
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
