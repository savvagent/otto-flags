name: CI

# The server: crates/ (flags-core, flags-mcp, flags-api, flags-server).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # `#[sqlx::test]` runs against a real Postgres, no mocks. A superuser, as
      # in compose.yaml, so the baseline migration can create and grant otto_app.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flags
          POSTGRES_PASSWORD: flags
          POSTGRES_DB: otto_flags
        ports:
          - 15434:5432
        options: >-
          --health-cmd "pg_isready -U flags -d otto_flags"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://flags:flags@localhost:15434/otto_flags
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The baseline creates otto_app itself and tolerates losing the race, but
      # many test databases migrate in parallel against one cluster-scoped role;
      # creating it first takes the race out.
      - name: Pre-create the otto_app role
        run: psql "$DATABASE_URL" -c "CREATE ROLE otto_app NOLOGIN;"

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  # Migrations are append-only. sqlx stores each applied migration's checksum
  # and refuses to start against a database whose files no longer match, so
  # editing even a comment in an applied migration takes down the next deploy.
  migrations-append-only:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse changes to existing migrations
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-status --diff-filter=MDR "origin/${BASE_REF}...HEAD" -- 'crates/*/migrations/')
          if [ -n "$changed" ]; then
            echo "::error::existing migrations were modified, deleted, or renamed; add a new migration instead"
            echo "$changed"
            exit 1
          fi

  # Proves the deploy artifact builds; `cargo test` can pass while the image
  # does not.
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Every green push to main deploys. flyctl builds remotely on Fly's builder,
  # the same path as a hand-run `fly deploy`. FLY_API_TOKEN is a deploy token
  # scoped to this one app (`fly tokens create deploy -a otto-flags`).
  deploy:
    runs-on: ubuntu-latest
    needs: [rust, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1
      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only -a otto-flags
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
